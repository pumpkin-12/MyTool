[package]
name = "toolbox"
version = "0.1.0"
description = "个人工具箱"
authors = ["lijiazhen"]
edition = "2021"
rust-version = "1.77.2"

# 只出 Windows 桌面端，因此只需要 rlib。
# Tauri 模板默认的 staticlib（iOS 用）/ cdylib（Android 用）在本项目纯属浪费：
# staticlib 会让 Cargo 额外产出一份约 693 MB 的静态库归档躺在 target/ 里，
# 对 toolbox.exe 与安装包没有任何影响。
# 将来若真要出移动端，把对应项加回即可（一行的事）。
[lib]
name = "toolbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# 系统状态模块用到的 Win32 API。这个包本来就作为传递依赖躺在 Cargo.lock 里，
# 显式声明只是为了能在代码里 `use` 它 —— 不会产生新的下载（只需编一次，无 proc-macro）。
# 只勾选实际用到的 feature，其余 217 个 Win32_* 都不参与编译。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
