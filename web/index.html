<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人工具箱</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --ok: #0F6E56;
    --err: #A32D2D;
  }
  :root.dark {
    --bg: #16181c;
    --surface: #1f2227;
    --text: #e6e8ea;
    --muted: #9aa1ab;
    --border: #2c3036;
    --accent: #5b9bff;
  }
  * { box-sizing: border-box; }
  /* 🔴 `hidden` 属性只是个 UA 样式 `[hidden]{display:none}`，
   * **任何作者样式里的 display 都会把它盖掉**（UA 规则优先级最低）。
   * .il-heat-range 就是被自己的 display:flex 吃掉了 hidden，导致
   * 「只在自定义区间时显示」变成「一直显示」—— 2026-09-16 用户截图才发现。
   * 这条兜底保证 hidden 永远算数，别再逐个元素去补。 */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .mono { font-family: ui-monospace, Consolas, "Courier New", monospace; }

  .hero { text-align: center; padding: 48px 20px 28px; }
  .hero h1 { font-size: 24px; font-weight: 500; margin: 0 0 8px; }
  .hero p { color: var(--muted); font-size: 13px; margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 48px;
  }
  .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.dragging { opacity: .35; border-style: dashed; }
  .grid-hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 48px; }
  .data-bar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 760px; margin: 0 auto 48px; padding: 0 20px; }
  .data-bar .hint { flex: 1 1 100%; text-align: center; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .card-icon svg { width: 22px; height: 22px; }
  .card-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .card-desc { font-size: 12px; color: var(--muted); }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--accent); }
  .tool-title { font-size: 15px; font-weight: 500; }
  .tool-body { max-width: 760px; margin: 0 auto; padding: 20px 20px 48px; }
  .tool-body.wide { max-width: 1100px; }

  .btn {
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

  .field {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .field:focus { border-color: var(--accent); }
  textarea.field { resize: vertical; }
  input[type="checkbox"] { accent-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; }

  /* 通用组件：标签条 / 工具栏 / 统计卡。题库、缺陷统计、mermaid 共用这一套。 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 13px; font-family: inherit; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .bar .field { width: auto; }
  .bar .sp { margin-left: auto; color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stats > div { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px 14px; }
  .stats .k { font-size: 12px; color: var(--muted); }
  .stats .v { font-size: 22px; font-weight: 500; margin-top: 2px; }

  /* .todo-del 由实习日志复用，保留 */
  .todo-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; }
  .todo-del:hover { color: var(--err); }

  .note-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px; margin-bottom: 12px; }
  .note-card textarea { width: 100%; min-height: 90px; border: none; background: transparent; color: var(--text); resize: vertical; outline: none; font-size: 13px; line-height: 1.6; font-family: inherit; }
  .note-foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  .il-remarks { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
  .il-remark { display: flex; align-items: center; gap: 8px; }
  .il-remark .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .il-remark input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 12px; outline: none; padding: 2px 0; border-bottom: 1px dashed transparent; font-family: inherit; }
  .il-remark input:focus { border-bottom-color: var(--border); }
  .il-rdel, .il-radd, .il-imgadd { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }
  .il-radd:hover, .il-imgadd:hover { color: var(--accent); }
  .il-foot-btns { display: flex; gap: 10px; }
  /* 日志配图：复用 AppStore 资产机制（内容哈希去重，存 data/assets/） */
  .il-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .il-imgs:empty { display: none; }
  .il-img-wrap { position: relative; display: inline-block; line-height: 0; }
  .il-img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; display: block; background: var(--bg); }
  .il-img-missing { outline: 2px dashed var(--err); outline-offset: -2px; cursor: not-allowed; }
  .il-img-del { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; line-height: 1; font-size: 12px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .12s; }
  .il-img-wrap:hover .il-img-del { opacity: 1; }
  .il-img-del:hover { color: var(--err); border-color: var(--err); }
  .il-drop { outline: 2px dashed var(--accent); outline-offset: 3px; }
  /* 结构化检索条 + 标签筛选 chips。
   * ⚠️ 这两块**必须在 .il-list 之外** —— renderList() 会重写 .il-list 的 innerHTML，
   *    放进去输入一个字就失焦（见 internlog.js 里的注释）。 */
  .il-search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .il-search .field { padding: 4px 8px; font-size: 13px; }
  .il-search .il-s-q { flex: 1 1 200px; min-width: 150px; }
  .il-search .il-s-from, .il-search .il-s-to { width: 142px; }
  .il-search .il-s-min, .il-search .il-s-max { width: 76px; }
  .il-tagfilter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .il-tagfilter .il-tag em { font-style: normal; opacity: .6; margin-left: 4px; font-size: 11px; }
  /* 效率趋势（手写 SVG）。颜色**全部走 CSS 类 + 主题变量**，
   * 所以深浅色主题自动跟随，不需要监听主题变化重绘 —— 这是选 SVG 不选 canvas 的主因。 */
  .il-trend { margin-bottom: 12px; }
  .il-trend .il-trend-range { font-weight: 400; color: var(--muted); font-size: 12px; }
  .tr-chart { width: 100%; height: auto; display: block; }
  .tr-gl { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
  .tr-lb { fill: var(--muted); font-size: 10px; }
  .tr-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .tr-ma { fill: none; stroke: var(--accent); stroke-width: 3; opacity: .28; stroke-linejoin: round; }
  .tr-dot { fill: var(--accent); }
  .tr-un { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 2; }
  .tr-legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tr-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .tr-legend .tr-c-line { background: var(--accent); }
  .tr-legend .tr-c-ma { background: var(--accent); opacity: .3; }
  .tr-legend .tr-c-un { width: 8px; height: 8px; border-radius: 50%; background: none; border: 1.5px dashed var(--muted); }
  /* 缺失周报提示条（周报面板内） */
  .il-rp-miss { display: block; margin: 6px 0; line-height: 1.7; }
  .il-rp-miss b { color: var(--accent); }
  .il-miss-btns { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
  /* Markdown 预览（internlog「预览」开关）。用了主题变量，深浅色都跟得上 */
  .il-md { font-size: 13px; line-height: 1.75; color: var(--text); word-break: break-word; }
  .il-md-empty { color: var(--muted); font-style: italic; }
  .il-md p { margin: 0 0 6px; }
  .il-md p:last-child { margin-bottom: 0; }
  .il-md h1, .il-md h2, .il-md h3, .il-md h4, .il-md h5, .il-md h6 { margin: 10px 0 6px; line-height: 1.35; }
  .il-md h1 { font-size: 1.45em; }
  .il-md h2 { font-size: 1.3em; }
  .il-md h3 { font-size: 1.15em; }
  .il-md h4, .il-md h5, .il-md h6 { font-size: 1em; }
  .il-md ul, .il-md ol { margin: 4px 0 6px; padding-left: 22px; }
  .il-md li { margin: 2px 0; }
  .il-md blockquote { margin: 6px 0; padding: 2px 0 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .il-md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .il-md a { color: var(--accent); }
  .il-md code.md-ic { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
  .il-md pre.md-code { position: relative; margin: 6px 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  .il-md pre.md-code code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.6; white-space: pre; color: var(--text); }
  .il-md pre.md-code[data-lang]::before { content: attr(data-lang); position: absolute; top: 4px; right: 8px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .il-md table.md-table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .il-md table.md-table th, .il-md table.md-table td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  .il-md table.md-table th { background: var(--bg); font-weight: 600; }
  .il-rdel:hover { color: var(--err); }

  .il-report { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px; margin-bottom: 14px; }
  .il-report-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .il-report-row .field { width: auto; }
  textarea.il-rp-out { min-height: 180px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; }

  .il-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .il-date { width: 150px; padding: 6px 10px; font-size: 13px; flex: 0 0 auto; }
  .il-head .todo-del { flex: 0 0 auto; }

  .il-tags { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 140px; }
  .il-tag { font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
  .il-tag.on { border-color: var(--accent); color: var(--accent); }
  .il-tag-add { border-style: dashed; color: var(--muted); }
  .il-tag-add:hover { border-color: var(--accent); color: var(--accent); }
  .il-tp { margin: 6px 0 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 8px 10px; }
  .il-tp-search { width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; outline: none; font-family: inherit; }
  .il-tp-search:focus { border-color: var(--accent); }
  .il-tp-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 110px; overflow-y: auto; }
  .il-tp-item { font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; }
  .il-tp-item:hover { border-color: var(--accent); }
  .il-tp-item.on { border-color: var(--accent); color: var(--accent); }
  .il-tp-item em { font-style: normal; color: var(--muted); margin-left: 4px; font-size: 10px; }
  .il-tp-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .il-mood { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
  .il-mood-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); cursor: pointer; }
  .il-mood-dot.on { background: var(--accent); }
  .il-heat-year { width: auto; padding: 3px 8px; font-size: 12px; }

  .il-heat { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px; margin-bottom: 16px; }
  .il-heat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .il-heat-title { font-size: 13px; font-weight: 500; }
  .heat-scroll { overflow-x: auto; }
  .heat-months { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-left: 38px; }
  .heat-months span { position: absolute; top: 0; white-space: nowrap; }
  .heat-rows { display: flex; }
  .heat-days { position: relative; width: 34px; margin-right: 4px; height: 102px; flex: 0 0 34px; font-size: 11px; color: var(--muted); }
  .heat-days span { position: absolute; right: 0; line-height: 12px; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); grid-auto-columns: 12px; gap: 3px; }
  .heat-grid i { width: 12px; height: 12px; border-radius: 2px; }
  .heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .heat-legend i { width: 12px; height: 12px; border-radius: 2px; }
  /* 贡献度热力图色阶 —— 按「当天最高效率」上色（mood 1~5），不是按日志条数。
   * m0 = 当天没写；mn = 写了但没评效率；m1~m5 = 效率 1~5，绿由浅到深。
   * lo = 自定义区间外的空白格；lf = 未来日期。 */
  .m0 { background: #ebedf0; }
  .mn { background: #ebedf0; border: 1px dashed #a8b0b8; box-sizing: border-box; }
  .m1 { background: #c9f0d2; }
  .m2 { background: #9be9a8; }
  .m3 { background: #4fc46e; }
  .m4 { background: #2d9550; }
  .m5 { background: #1a6b38; }
  .heat-grid i.lo { background: transparent; }
  .heat-grid i.lf { background: transparent; border: 1px dashed var(--border); box-sizing: border-box; }
  /* 深色下反过来：值越大越亮（深绿在深底上看不见） */
  .dark .m0 { background: #2c3036; }
  .dark .mn { background: #2c3036; border-color: #4a5058; }
  .dark .m1 { background: #1b3d27; }
  .dark .m2 { background: #24583a; }
  .dark .m3 { background: #2f7a4d; }
  .dark .m4 { background: #3fa363; }
  .dark .m5 { background: #56c47c; }
  .il-heat-range { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .il-heat-range input[type="date"] { width: auto; padding: 3px 8px; font-size: 12px; }

  /* —— 画板（无限画布白板） —— */
  .wb-wrap { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #ffffff; user-select: none; }
  .wb-canvas { display: block; width: 100%; height: 520px; touch-action: none; }
  .wb-toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; align-items: center; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); z-index: 5; flex-wrap: wrap; max-width: calc(100% - 20px); }
  .wb-tbtn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .wb-tbtn:hover { background: var(--bg); color: var(--text); }
  .wb-tbtn.on { background: var(--accent); color: #fff; }
  .wb-tbtn:disabled { opacity: .35; cursor: default; }
  .wb-tbtn:disabled:hover { background: transparent; color: var(--muted); }
  .wb-tbtn svg { width: 17px; height: 17px; }
  .wb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
  .wb-swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; outline: 2px solid transparent; outline-offset: 1px; }
  .wb-swatch.on { outline-color: var(--accent); }
  .wb-color-input { width: 20px; height: 20px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); cursor: pointer; padding: 2px; }
  .wb-size { width: 80px; accent-color: var(--accent); }
  .wb-size-dot { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .wb-size-dot i { background: var(--text); border-radius: 50%; display: block; }
  .wb-zoombar { position: absolute; left: 10px; bottom: 10px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); }
  .wb-zoombar button { border: none; background: transparent; color: var(--text); cursor: pointer; width: 22px; height: 22px; border-radius: 6px; font-size: 15px; line-height: 1; padding: 0; }
  .wb-zoombar button:hover { background: var(--bg); }
  .wb-zoombar .wb-pct { min-width: 40px; text-align: center; cursor: pointer; }
  .wb-mini { position: absolute; right: 10px; bottom: 10px; z-index: 5; width: 160px; height: 100px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: 0 4px 16px rgba(0,0,0,.1); cursor: crosshair; overflow: hidden; }
  .wb-mini canvas { display: block; width: 100%; height: 100%; }
  .wb-editor { position: absolute; z-index: 6; margin: 0; padding: 4px 6px; border: 2px solid var(--accent); border-radius: 6px; outline: none; resize: none; overflow: hidden; white-space: pre; min-width: 60px; background: transparent; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .wb-foot { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .wb-ctx { position: absolute; z-index: 8; min-width: 168px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none; flex-direction: column; }
  .wb-ctx button { display: flex; justify-content: space-between; align-items: center; gap: 18px; border: none; background: transparent; color: var(--text); font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
  .wb-ctx button:hover { background: var(--bg); }
  .wb-ctx button:disabled { opacity: .4; cursor: default; }
  .wb-ctx button:disabled:hover { background: transparent; }
  .wb-ctx button i { font-style: normal; color: var(--muted); font-size: 11px; }
  .wb-ctx button.danger { color: var(--err); }
  .wb-ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  #themeBtn {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  #themeBtn:hover { color: var(--accent); border-color: var(--accent); }
  #themeBtn svg { width: 18px; height: 18px; }

  /* ---------- Mermaid 编辑器 ---------- */
  .mm-btn {
    padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-family: inherit;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  .mm-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mm-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent)14; }
  .mm-btn:disabled { opacity: .45; cursor: not-allowed; }
  .mm-btn:disabled:hover { border-color: var(--border); color: var(--text); }

  .mm-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .mm-split { grid-template-columns: 1fr; } }
  .mm-pane {
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    overflow: hidden; display: flex; flex-direction: column; min-height: 460px;
  }
  .mm-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  .mm-head b { font-weight: 500; color: var(--text); }

  /* 编辑器三层：行号 + 高亮层 + 透明 textarea */
  .mm-edit { position: relative; flex: 1 1 auto; overflow: hidden; background: var(--surface); }
  .mm-ln {
    position: absolute; top: 0; left: 0; width: 42px; padding: 12px 8px 12px 0;
    text-align: right; font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.7; color: var(--muted); opacity: .55;
    border-right: 1px solid var(--border); user-select: none; pointer-events: none;
    white-space: pre; overflow: hidden;
  }
  .mm-hl, .mm-ta {
    position: absolute; inset: 0; margin: 0; border: 0; outline: none;
    padding: 12px 12px 12px 54px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.7; letter-spacing: 0;
    white-space: pre; overflow: auto; word-wrap: normal;
  }
  .mm-hl { pointer-events: none; color: var(--text); }
  .mm-ta { background: transparent; color: transparent; caret-color: var(--accent); resize: none; }
  .mm-ta::selection { background: var(--accent)33; }
  .mm-hl .k1 { color: #534AB7; }
  .mm-hl .k2 { color: #0F6E56; }
  .mm-hl .k3 { color: #BA7517; }
  .mm-hl .k4 { color: var(--muted); font-style: italic; }
  .mm-hl .k5 { color: #A32D2D; }
  .dark .mm-hl .k1 { color: #AFA9EC; }
  .dark .mm-hl .k2 { color: #5DCAA5; }
  .dark .mm-hl .k3 { color: #EF9F27; }
  .dark .mm-hl .k5 { color: #F09595; }
  .mm-hl .ln-err {
    display: block; background: #A32D2D22; box-shadow: inset 2px 0 0 #A32D2D;
  }

  .mm-prev { flex: 1 1 auto; padding: 16px; overflow: auto; display: flex; align-items: center; justify-content: center; }
  .mm-prev svg { max-width: 100%; height: auto; }
  /* 出错时：旧图在上（压暗），错误卡片在下，避免预览区闪白 */
  .mm-bad-wrap { align-self: stretch; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .mm-bad-wrap > svg { opacity: .45; max-height: 260px; }
  .mm-tip { color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.8; }
  .mm-err {
    border: 1px solid var(--err); border-radius: 10px; background: #A32D2D10;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.7; color: var(--err);
    align-self: stretch; text-align: left;
  }
  .mm-err .mm-err-t { font-weight: 500; margin-bottom: 4px; }
  .mm-err pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; opacity: .85; }
  .mm-foot {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  .mm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .mm-dot.ok { background: var(--ok); }
  .mm-dot.bad { background: var(--err); }
  .mm-dot.wait { background: var(--border); }
  .mm-zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .mm-zoom button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; line-height: 1;
    font-size: 13px; font-family: inherit; padding: 0;
  }
  .mm-zoom button:hover { border-color: var(--accent); color: var(--accent); }
  .mm-menu {
    position: absolute; z-index: 40; min-width: 132px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px #0000001f; display: flex; flex-direction: column;
  }
  .mm-menu button {
    border: 0; background: transparent; color: var(--text); text-align: left;
    padding: 7px 10px; font-size: 12.5px; border-radius: 6px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .mm-menu button:hover { background: var(--accent)14; color: var(--accent); }
  .mm-menu .mm-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .mm-hist { font-size: 12px; color: var(--muted); }
  .mm-hist:hover { color: var(--accent); cursor: pointer; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
  /* 带动作按钮的 toast（如「已删除 · 撤销」）：默认整条不吃点击，有按钮时才放开 */
  #toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
  #toast .toast-act { border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; cursor: pointer; opacity: .9; }
  #toast .toast-act:hover { opacity: 1; background: rgba(127, 127, 127, .25); }
  /* ---------- 刷题 ---------- */
  .qz-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .qz-mode { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px 14px; text-align: center; cursor: pointer; }
  .qz-mode:hover { border-color: var(--accent); }
  .qz-mode .t { font-weight: 500; margin-bottom: 4px; }
  .qz-mode .d { font-size: 12px; color: var(--muted); }
  .qz-q { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px; margin-bottom: 12px; }
  .qz-qtext { font-size: 15px; line-height: 1.7; margin-bottom: 14px; white-space: pre-wrap; }
  .qz-opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .qz-opt:hover { border-color: var(--accent); }
  .qz-opt.on { border-color: var(--accent); background: #eff5ff; }
  .qz-opt.ok { border-color: var(--ok); background: #f0faf6; }
  .qz-opt.bad { border-color: var(--err); background: #fdf3f3; }
  .qz-opt .k { width: 18px; flex: 0 0 auto; font-weight: 500; }
  .qz-opt .v { flex: 1; white-space: pre-wrap; }
  .qz-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .qz-cell { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 12px; cursor: pointer; font-family: inherit; color: var(--muted); padding: 0; }
  .qz-cell.ans { border-color: var(--accent); color: var(--accent); }
  .qz-cell.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qz-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .qz-tbl th, .qz-tbl td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  .qz-tbl th { color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .qz-tbl .num { width: 44px; color: var(--muted); }
  .qz-tbl .act { width: 108px; white-space: nowrap; }
  .qz-tbl pre { margin: 0; background: none; border: none; padding: 0; font-size: 12px; }
  .qz-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 5px; background: #f1f3f5; color: var(--muted); white-space: nowrap; }
  .qz-tag.ok { background: #e1f5ee; color: var(--ok); }
  .qz-tag.bad { background: #fcebeb; color: var(--err); }
  .qz-timer { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .qz-timer.warn { color: var(--err); }
  :root.dark .qz-opt.on { background: #1e2a3d; }
  :root.dark .qz-opt.ok { background: #12281f; }
  :root.dark .qz-opt.bad { background: #2b1717; }
  :root.dark .qz-tag { background: #26292e; }
  :root.dark .qz-tag.ok { background: #12281f; }
  :root.dark .qz-tag.bad { background: #2b1717; }
  /* ---------- 缺陷统计 ---------- */
  /* 记录页是 Excel 那种网格表：表头吸顶、单元格直接改、聚焦画粗框、整行选中高亮。
   * 列多，所以让表格自己横滚（.df-scroll），不把整页撑宽。 */
  .df-scroll { overflow: auto; max-height: calc(100vh - 268px); border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .df-table { width: 100%; min-width: 1180px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .df-table th { position: sticky; top: 0; z-index: 2; background: var(--bg); text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
  .df-table td { padding: 0; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  .df-table th:last-child, .df-table td:last-child { border-right: none; }
  .df-table tbody tr:last-child td { border-bottom: none; }
  .df-table tbody tr:hover td { background: rgba(120, 130, 145, .08); }
  .df-table tbody tr.on td { background: rgba(37, 99, 235, .09); }
  :root.dark .df-table tbody tr.on td { background: rgba(91, 155, 255, .16); }
  /* 严重程度用行首色条标出来，扫一眼就知道哪条最严重 */
  .df-table tr[data-sev="fatal"] td:first-child { box-shadow: inset 3px 0 0 #A32D2D; }
  .df-table tr[data-sev="major"] td:first-child { box-shadow: inset 3px 0 0 #BA7517; }
  .df-table tr[data-sev="normal"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .df-table tr[data-sev="minor"] td:first-child { box-shadow: inset 3px 0 0 var(--border); }
  .cell { display: block; width: 100%; box-sizing: border-box; border: none; background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 6px 8px; outline: none; }
  .cell:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.mono { font-size: 12px; }
  textarea.cell { resize: vertical; min-height: 31px; line-height: 1.5; font-family: inherit; }
  .df-table td.df-age { padding: 6px 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .df-table td.df-op { text-align: center; }
  .df-del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; padding: 6px 8px; border-radius: 6px; }
  .df-del:hover { color: var(--err); background: rgba(163, 45, 45, .08); }
  .df-empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; }
  /* 严重程度四档配色：文字跟着档位走，不必逐条读下拉框 */
  .cell.sev-fatal { color: #A32D2D; font-weight: 500; }
  .cell.sev-major { color: #BA7517; font-weight: 500; }
  .cell.sev-normal { color: var(--accent); }
  .cell.sev-minor { color: var(--muted); }
  :root.dark .cell.sev-fatal { color: #F09595; }
  :root.dark .cell.sev-major { color: #EF9F27; }
  :root.dark .cell.sev-normal { color: #5b9bff; }
  .df-sec { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px; margin-bottom: 14px; }
  .df-sec-t { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .df-stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--bg); }
  .df-stack i { display: block; height: 100%; }
  .df-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .df-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
  .df-bars { display: flex; flex-direction: column; gap: 7px; }
  .df-brow { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .df-brow .lb { width: 84px; flex: 0 0 auto; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .df-brow .tk { flex: 1; height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; }
  .df-brow .tk i { display: block; height: 100%; border-radius: 5px; }
  .df-brow .n { width: 34px; text-align: right; flex: 0 0 auto; }
  .df-chart { width: 100%; height: auto; display: block; }
  .df-chart .gl { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
  .df-chart .lb { fill: var(--muted); font-size: 10px; }
  .df-chart .b1 { fill: var(--accent); }
  .df-chart .b2 { fill: var(--ok); }
  /* 色块（与严重程度一一对应，另加「关闭」用的绿） */
  .df-c-fatal { background: #A32D2D; }
  .df-c-major { background: #BA7517; }
  .df-c-normal { background: #2563eb; }
  .df-c-minor { background: #9aa1ab; }
  .df-c-unknown { background: #c9ced6; }
  .df-c-ok { background: var(--ok); }
</style>
</head>
<body>
<div id="app"></div>
<!-- 前端按板块分成 js/*.js：都是普通（非 module）外链脚本，共用同一个全局作用域，
     所以下面的顺序就是执行顺序 —— store 最先，各板块自行 registerTool，app.js 最后启动路由。
     不改成 ES 模块是有意的：CSP 是 script-src 'self'，而共享全局作用域的语义可以原样保留。 -->
<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script src="js/sysinfo.js"></script>
<script src="js/ui.js"></script>
<script src="js/tools.js"></script>
<script src="js/tools/internlog.js"></script>
<script src="js/tools/sketch.js"></script>
<script src="js/tools/mermaid.js"></script>
<script src="js/tools/quiz.js"></script>
<script src="js/tools/defect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
