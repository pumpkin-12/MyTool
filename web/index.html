<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="YAd5rJcHu5QY02Odjz9Lsa">
<head data-page-node-id="uL2uVQ1HiJ4yesOystCL6Y">
<meta charset="UTF-8" data-page-node-id="bH8Qom4cRNAurmTGrSzahr">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="8BTsxLE75EnOAHaHzlXDbh">
<title>个人工具箱</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --ok: #0F6E56;
    --err: #A32D2D;
  }
  :root.dark {
    --bg: #16181c;
    --surface: #1f2227;
    --text: #e6e8ea;
    --muted: #9aa1ab;
    --border: #2c3036;
    --accent: #5b9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  .mono { font-family: ui-monospace, Consolas, "Courier New", monospace; }

  .hero { text-align: center; padding: 48px 20px 28px; }
  .hero h1 { font-size: 24px; font-weight: 500; margin: 0 0 8px; }
  .hero p { color: var(--muted); font-size: 13px; margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 48px;
  }
  .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.dragging { opacity: .35; border-style: dashed; }
  .grid-hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 48px; }
  .data-bar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 760px; margin: 0 auto 48px; padding: 0 20px; }
  .data-bar .hint { flex: 1 1 100%; text-align: center; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .card-icon svg { width: 22px; height: 22px; }
  .card-name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .card-desc { font-size: 12px; color: var(--muted); }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--accent); }
  .tool-title { font-size: 15px; font-weight: 500; }
  .tool-body { max-width: 760px; margin: 0 auto; padding: 20px 20px 48px; }
  .tool-body.wide { max-width: 1100px; }

  .btn {
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

  .field {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .field:focus { border-color: var(--accent); }
  textarea.field { resize: vertical; }
  input[type="checkbox"] { accent-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; }

  /* .todo-del 由实习日志复用，保留 */
  .todo-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; }
  .todo-del:hover { color: var(--err); }

  .note-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px; margin-bottom: 12px; }
  .note-card textarea { width: 100%; min-height: 90px; border: none; background: transparent; color: var(--text); resize: vertical; outline: none; font-size: 13px; line-height: 1.6; font-family: inherit; }
  .note-foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  .il-remarks { margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
  .il-remark { display: flex; align-items: center; gap: 8px; }
  .il-remark .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .il-remark input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 12px; outline: none; padding: 2px 0; border-bottom: 1px dashed transparent; font-family: inherit; }
  .il-remark input:focus { border-bottom-color: var(--border); }
  .il-rdel, .il-radd { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }
  .il-radd:hover { color: var(--accent); }
  .il-rdel:hover { color: var(--err); }

  .il-report { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px; margin-bottom: 14px; }
  .il-report-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .il-report-row .field { width: auto; }
  textarea.il-rp-out { min-height: 180px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; line-height: 1.7; }

  .il-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .il-date { width: 150px; padding: 6px 10px; font-size: 13px; flex: 0 0 auto; }
  .il-head .todo-del { flex: 0 0 auto; }

  .il-tags { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 140px; }
  .il-tag { font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
  .il-tag.on { border-color: var(--accent); color: var(--accent); }
  .il-tag-add { border-style: dashed; color: var(--muted); }
  .il-tag-add:hover { border-color: var(--accent); color: var(--accent); }
  .il-tp { margin: 6px 0 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 8px 10px; }
  .il-tp-search { width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; outline: none; font-family: inherit; }
  .il-tp-search:focus { border-color: var(--accent); }
  .il-tp-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 110px; overflow-y: auto; }
  .il-tp-item { font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; }
  .il-tp-item:hover { border-color: var(--accent); }
  .il-tp-item.on { border-color: var(--accent); color: var(--accent); }
  .il-tp-item em { font-style: normal; color: var(--muted); margin-left: 4px; font-size: 10px; }
  .il-tp-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .il-mood { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
  .il-mood-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); cursor: pointer; }
  .il-mood-dot.on { background: var(--accent); }
  .il-heat-year { width: auto; padding: 3px 8px; font-size: 12px; }

  .il-heat { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px; margin-bottom: 16px; }
  .il-heat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .il-heat-title { font-size: 13px; font-weight: 500; }
  .heat-scroll { overflow-x: auto; }
  .heat-months { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-left: 38px; }
  .heat-months span { position: absolute; top: 0; white-space: nowrap; }
  .heat-rows { display: flex; }
  .heat-days { position: relative; width: 34px; margin-right: 4px; height: 102px; flex: 0 0 34px; font-size: 11px; color: var(--muted); }
  .heat-days span { position: absolute; right: 0; line-height: 12px; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); grid-auto-columns: 12px; gap: 3px; }
  .heat-grid i { width: 12px; height: 12px; border-radius: 2px; }
  .heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .heat-legend i { width: 12px; height: 12px; border-radius: 2px; }
  .l0 { background: #ebedf0; }
  .l1 { background: #9be9a8; }
  .l2 { background: #40c463; }
  .l3 { background: #216e39; }
  .dark .l0 { background: #2c3036; }
  .heat-grid i.lf { background: transparent; border: 1px dashed var(--border); box-sizing: border-box; }

  /* —— 画板（无限画布白板） —— */
  .wb-wrap { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #ffffff; user-select: none; }
  .wb-canvas { display: block; width: 100%; height: 520px; touch-action: none; }
  .wb-toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; align-items: center; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); z-index: 5; flex-wrap: wrap; max-width: calc(100% - 20px); }
  .wb-tbtn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .wb-tbtn:hover { background: var(--bg); color: var(--text); }
  .wb-tbtn.on { background: var(--accent); color: #fff; }
  .wb-tbtn:disabled { opacity: .35; cursor: default; }
  .wb-tbtn:disabled:hover { background: transparent; color: var(--muted); }
  .wb-tbtn svg { width: 17px; height: 17px; }
  .wb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
  .wb-swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; outline: 2px solid transparent; outline-offset: 1px; }
  .wb-swatch.on { outline-color: var(--accent); }
  .wb-color-input { width: 20px; height: 20px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); cursor: pointer; padding: 2px; }
  .wb-size { width: 80px; accent-color: var(--accent); }
  .wb-size-dot { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .wb-size-dot i { background: var(--text); border-radius: 50%; display: block; }
  .wb-zoombar { position: absolute; left: 10px; bottom: 10px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); }
  .wb-zoombar button { border: none; background: transparent; color: var(--text); cursor: pointer; width: 22px; height: 22px; border-radius: 6px; font-size: 15px; line-height: 1; padding: 0; }
  .wb-zoombar button:hover { background: var(--bg); }
  .wb-zoombar .wb-pct { min-width: 40px; text-align: center; cursor: pointer; }
  .wb-mini { position: absolute; right: 10px; bottom: 10px; z-index: 5; width: 160px; height: 100px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: 0 4px 16px rgba(0,0,0,.1); cursor: crosshair; overflow: hidden; }
  .wb-mini canvas { display: block; width: 100%; height: 100%; }
  .wb-editor { position: absolute; z-index: 6; margin: 0; padding: 4px 6px; border: 2px solid var(--accent); border-radius: 6px; outline: none; resize: none; overflow: hidden; white-space: pre; min-width: 60px; background: transparent; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .wb-foot { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .wb-ctx { position: absolute; z-index: 8; min-width: 168px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none; flex-direction: column; }
  .wb-ctx button { display: flex; justify-content: space-between; align-items: center; gap: 18px; border: none; background: transparent; color: var(--text); font-size: 13px; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
  .wb-ctx button:hover { background: var(--bg); }
  .wb-ctx button:disabled { opacity: .4; cursor: default; }
  .wb-ctx button:disabled:hover { background: transparent; }
  .wb-ctx button i { font-style: normal; color: var(--muted); font-size: 11px; }
  .wb-ctx button.danger { color: var(--err); }
  .wb-ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  #themeBtn {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  #themeBtn:hover { color: var(--accent); border-color: var(--accent); }
  #themeBtn svg { width: 18px; height: 18px; }

  /* ---------- Mermaid 编辑器 ---------- */
  .mm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mm-bar .mm-sp { flex: 1 1 auto; }
  .mm-btn {
    padding: 5px 12px; border-radius: 8px; font-size: 12.5px; font-family: inherit;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  .mm-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mm-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent)14; }
  .mm-btn:disabled { opacity: .45; cursor: not-allowed; }
  .mm-btn:disabled:hover { border-color: var(--border); color: var(--text); }

  .mm-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .mm-split { grid-template-columns: 1fr; } }
  .mm-pane {
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    overflow: hidden; display: flex; flex-direction: column; min-height: 460px;
  }
  .mm-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  .mm-head b { font-weight: 500; color: var(--text); }

  /* 编辑器三层：行号 + 高亮层 + 透明 textarea */
  .mm-edit { position: relative; flex: 1 1 auto; overflow: hidden; background: var(--surface); }
  .mm-ln {
    position: absolute; top: 0; left: 0; width: 42px; padding: 12px 8px 12px 0;
    text-align: right; font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.7; color: var(--muted); opacity: .55;
    border-right: 1px solid var(--border); user-select: none; pointer-events: none;
    white-space: pre; overflow: hidden;
  }
  .mm-hl, .mm-ta {
    position: absolute; inset: 0; margin: 0; border: 0; outline: none;
    padding: 12px 12px 12px 54px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.7; letter-spacing: 0;
    white-space: pre; overflow: auto; word-wrap: normal;
  }
  .mm-hl { pointer-events: none; color: var(--text); }
  .mm-ta { background: transparent; color: transparent; caret-color: var(--accent); resize: none; }
  .mm-ta::selection { background: var(--accent)33; }
  .mm-hl .k1 { color: #534AB7; }
  .mm-hl .k2 { color: #0F6E56; }
  .mm-hl .k3 { color: #BA7517; }
  .mm-hl .k4 { color: var(--muted); font-style: italic; }
  .mm-hl .k5 { color: #A32D2D; }
  .dark .mm-hl .k1 { color: #AFA9EC; }
  .dark .mm-hl .k2 { color: #5DCAA5; }
  .dark .mm-hl .k3 { color: #EF9F27; }
  .dark .mm-hl .k5 { color: #F09595; }
  .mm-hl .ln-err {
    display: block; background: #A32D2D22; box-shadow: inset 2px 0 0 #A32D2D;
  }

  .mm-prev { flex: 1 1 auto; padding: 16px; overflow: auto; display: flex; align-items: center; justify-content: center; }
  .mm-prev svg { max-width: 100%; height: auto; }
  /* 出错时：旧图在上（压暗），错误卡片在下，避免预览区闪白 */
  .mm-bad-wrap { align-self: stretch; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .mm-bad-wrap > svg { opacity: .45; max-height: 260px; }
  .mm-tip { color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.8; }
  .mm-err {
    border: 1px solid var(--err); border-radius: 10px; background: #A32D2D10;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.7; color: var(--err);
    align-self: stretch; text-align: left;
  }
  .mm-err .mm-err-t { font-weight: 500; margin-bottom: 4px; }
  .mm-err pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; opacity: .85; }
  .mm-foot {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  .mm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .mm-dot.ok { background: var(--ok); }
  .mm-dot.bad { background: var(--err); }
  .mm-dot.wait { background: var(--border); }
  .mm-zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .mm-zoom button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; line-height: 1;
    font-size: 13px; font-family: inherit; padding: 0;
  }
  .mm-zoom button:hover { border-color: var(--accent); color: var(--accent); }
  .mm-menu {
    position: absolute; z-index: 40; min-width: 132px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px #0000001f; display: flex; flex-direction: column;
  }
  .mm-menu button {
    border: 0; background: transparent; color: var(--text); text-align: left;
    padding: 7px 10px; font-size: 12.5px; border-radius: 6px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .mm-menu button:hover { background: var(--accent)14; color: var(--accent); }
  .mm-menu .mm-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .mm-hist { font-size: 12px; color: var(--muted); }
  .mm-hist:hover { color: var(--accent); cursor: pointer; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
  /* ---------- 刷题 ---------- */
  .qz-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .qz-tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 13px; font-family: inherit; }
  .qz-tab:hover { border-color: var(--accent); color: var(--accent); }
  .qz-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qz-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .qz-stats > div { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px 14px; }
  .qz-stats .k { font-size: 12px; color: var(--muted); }
  .qz-stats .v { font-size: 22px; font-weight: 500; margin-top: 2px; }
  .qz-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .qz-mode { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px 14px; text-align: center; cursor: pointer; }
  .qz-mode:hover { border-color: var(--accent); }
  .qz-mode .t { font-weight: 500; margin-bottom: 4px; }
  .qz-mode .d { font-size: 12px; color: var(--muted); }
  .qz-q { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 16px; margin-bottom: 12px; }
  .qz-qtext { font-size: 15px; line-height: 1.7; margin-bottom: 14px; white-space: pre-wrap; }
  .qz-opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .qz-opt:hover { border-color: var(--accent); }
  .qz-opt.on { border-color: var(--accent); background: #eff5ff; }
  .qz-opt.ok { border-color: var(--ok); background: #f0faf6; }

<script>
'use strict';

/* ============================================================
 * 存储抽象层（双形态：浏览器 / 桌面端）
 * 自动探测三种后端，接口签名完全一致，工具代码无需改动：
 *   - Tauri   ：window.__TAURI__.core.invoke('store_read'/'store_write')
 *   - Electron：window.NativeStore.readAll()/writeAll()（preload 注入）
 *   - 浏览器  ：localStorage
 * 桌面端是异步文件读写：界面初始化必须等 AppStore.ready 之后。
 * ============================================================ */
const AppStore = (function () {
  const PREFIX = 'toolbox:';
  const K = k => PREFIX + k;
  const T = (typeof window !== 'undefined' && window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
  const E = (typeof window !== 'undefined' && window.NativeStore) ? window.NativeStore : null;
  const native = !!(T || E);
  let mem = null;

  function clone(v) {
    try { return JSON.parse(JSON.stringify(v)); } catch (e) { return v; }
  }
  // 写盘串行化 + 失败可见。
  // 原来每次 set 都直接 invoke 一次，而多个 invoke 的完成顺序没有保证，
  // 快速连续保存时存在「后写覆盖先写」的竞态；串成一条 Promise 链即可消除。
  // 同时把失败暴露出来 —— 桌面端磁盘写满/权限异常时不能再静默。
  let writeChain = Promise.resolve();
  let writeOk = true;
  let writeErr = null;

  function persist() {
    if (!T && !E) return;
    const payload = JSON.stringify(mem || {});
    const run = T
      ? () => T.invoke('store_write', { data: payload })
      : () => Promise.resolve(E.writeAll(mem || {}));
    writeChain = writeChain.then(run).then(
      () => { writeOk = true; writeErr = null; },
      (e) => {
        writeOk = false;
        writeErr = (e && e.message) ? e.message : String(e);
        showToast('保存失败：' + writeErr);
      }
    );
  }

  // 启动时一次性把全部数据读进内存；失败也不能让界面卡死
  let ready = Promise.resolve();
  if (T) {
    ready = T.invoke('store_read').then(function (s) {
      try { mem = JSON.parse(s || '{}'); } catch (e) { mem = {}; }
      if (!mem || typeof mem !== 'object') mem = {};
    }).catch(function () { mem = {}; });
  } else if (E) {
    ready = Promise.resolve().then(function () { return E.readAll(); }).then(function (d) {
      mem = (d && typeof d === 'object') ? d : {};
    }).catch(function () { mem = {}; });
  }

  return {
    ready: ready,
    isNative: native,
    // 等待所有排队中的写入落盘。导入数据后要等它完成再刷新，否则可能读到旧值。
    flush() { return writeChain; },
    lastError() { return writeErr; },
    get(key, fallback) {
      if (native) {
        if (!mem) return fallback;
        const v = mem[K(key)];
        return (v === undefined || v === null) ? fallback : clone(v);
      }
      try {
        const v = localStorage.getItem(K(key));
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      if (native) {
        if (!mem) mem = {};
        mem[K(key)] = clone(value);
        persist();
        // 写盘是异步的，所以这里返回的是「上一次」写盘的结果：
        // 一次失败会在下一次保存时被工具感知到（例如画板的大体积告警），
        // 同时上面 persist() 里的 toast 会立刻提示，不会静默。
        return writeOk;
      }
      try {
        localStorage.setItem(K(key), JSON.stringify(value));
        return true;
      } catch (e) { return false; }
    },
    remove(key) {
      if (native) {
        if (mem) { delete mem[K(key)]; persist(); }
        return;
      }
      try { localStorage.removeItem(K(key)); } catch (e) {}
    },
    /* 全量导出 / 导入：浏览器版 → 桌面版迁移的唯一通道。
     * 导出的键一律带 PREFIX，导入时原样写回，两端格式对称。 */
    exportAll() {
      const out = {};
      if (native) {
        const src = mem || {};
        for (const k in src) {
          if (Object.prototype.hasOwnProperty.call(src, k)) out[k] = clone(src[k]);
        }
        return out;
      }
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || k.indexOf(PREFIX) !== 0) continue;
          try { out[k] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
        }
      } catch (e) {}
      return out;
    },
    /* 批量写入：合并后只落一次盘。一次业务保存常要写多个 key，
     * 逐个 set 会把「全量 stringify + 全量写盘」重复 N 倍。 */
    setMany(obj) {
      if (!obj || typeof obj !== 'object') return false;
      let n = 0;
      for (const k in obj) {
        if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
        if (native) {
          if (!mem) mem = {};
          mem[K(k)] = clone(obj[k]);
        } else {
          try { localStorage.setItem(K(k), JSON.stringify(obj[k])); }
          catch (e) { return false; }
        }
        n++;
      }
      if (native && n) persist();
      return true;
    },
    importAll(obj) {
      if (!obj || typeof obj !== 'object') return 0;
      let n = 0;
      if (native) {
        if (!mem) mem = {};
        for (const k in obj) {
          if (Object.prototype.hasOwnProperty.call(obj, k)) { mem[k] = clone(obj[k]); n++; }
        }
        if (n) persist();
        return n;
      }
      try {
        for (const k in obj) {
          if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
          localStorage.setItem(k, JSON.stringify(obj[k]));
          n++;
        }
      } catch (e) {}
      return n;
    }
  };
})();

/* ---------- 通用工具函数 ---------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtNum(n) {
  if (!isFinite(n)) return '-';
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e12 || abs < 1e-9) return n.toExponential(4);
  return String(parseFloat(n.toPrecision(10)));
}
function randInt(max) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}
let toastTimer = null;
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [0, 380].forEach(delay => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.value = 0.08;
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.22);
    });
    setTimeout(() => ctx.close(), 900);
  } catch (e) {}
}

/* ---------- 文件保存（双形态：桌面端原生对话框 / 浏览器下载） ---------- */
/* 桌面端 WebView2 对 <a download> + blob/data URL 的处理不受应用控制，
 * 可能静默丢弃或直接落到系统下载目录，所以桌面端一律走 Rust 的 save_file 命令。 */
function blobToBase64(blob) {
  return blob.arrayBuffer().then(function (ab) {
    const buf = new Uint8Array(ab);
    let s = '';
    const CH = 0x8000;              // 分块拼接，避免 apply 参数过多爆栈
    for (let i = 0; i < buf.length; i += CH) {
      s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
    }
    return btoa(s);
  });
}
async function saveBlob(blob, name) {
  const T = (typeof window !== 'undefined' && window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
  if (T) {
    try {
      const saved = await T.invoke('save_file', {
        fileName: name,
        dataBase64: await blobToBase64(blob)
      });
      if (!saved) { showToast('已取消导出'); return false; }
      showToast('已保存');
      return true;
    } catch (e) {
      showToast('导出失败：' + ((e && e.message) ? e.message : e));
      return false;
    }
  }
  // 浏览器：保持原有行为
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}

/* ---------- 应用内对话框 ----------
 * 不用 window.prompt / window.confirm：
 *   - Tauri 没实现原生 prompt（官方 issue #4783），桌面端常见行为是直接返回 null；
 *   - Tauri v2 + WebView2 桌面实测 confirm 是 no-op，不弹框直接返回 true，
 *     所有「确认后删除/清空」会被静默绕过，属数据丢失隐患。
 * 所以一律自绘模态框 + Promise，浏览器与桌面同一套代码。
 * 同一时刻只保留一个遮罩（uiOverlay 会先关掉上一个），cleanup 时统一收掉。 */
let __modalEl = null;
function uiOverlay(inner) {
  if (__modalEl) { __modalEl.remove(); __modalEl = null; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;';
  const card = document.createElement('div');
  card.style.cssText = 'background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:20px;width:min(480px,92vw);max-height:86vh;overflow:auto;';
  card.innerHTML = inner;
  box.appendChild(card);
  document.body.appendChild(box);
  __modalEl = box;
  return { box: box, card: card };
}
function uiCloseModal() { if (__modalEl) { __modalEl.remove(); __modalEl = null; } }
function uiBtnRow(yesLabel) {
  return '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">' +
    '<button class="btn" data-uicancel>取消</button>' +
    '<button class="btn btn-primary" data-uiok>' + (yesLabel || '确定') + '</button></div>';
}

/* 确认框 → Promise<boolean>，点遮罩/取消都视为 false */
function askConfirm(message, okText) {
  return new Promise(resolve => {
    const o = uiOverlay(
      '<div style="font-weight:500;margin-bottom:6px;white-space:pre-wrap;line-height:1.7;">' + esc(message) + '</div>' +
      uiBtnRow(okText));
    const done = v => { if (!__modalEl) return; uiCloseModal(); resolve(v); };
    o.card.querySelector('[data-uicancel]').addEventListener('click', () => done(false));
    o.card.querySelector('[data-uiok]').addEventListener('click', () => done(true));
    o.box.addEventListener('click', e => { if (e.target === o.box) done(false); });
  });
}

/* 表单框 → Promise<对象|null>。字段：{key,label,type:'text'|'number'|'select'|'checks',options,value,placeholder} */
function askForm(title, fields) {
  return new Promise(resolve => {
    const body = fields.map(f => {
      if (f.type === 'select') {
        return '<div style="margin-bottom:12px;"><div class="hint" style="margin-bottom:4px;">' + esc(f.label) + '</div>' +
          '<select class="field" data-k="' + esc(f.key) + '">' +
          (f.options || []).map(o => '<option value="' + esc(o.value) + '"' +
            (String(o.value) === String(f.value) ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') +
          '</select></div>';
      }
      if (f.type === 'checks') {
        return '<div style="margin-bottom:12px;"><div class="hint" style="margin-bottom:4px;">' + esc(f.label) + '</div>' +
          '<div style="display:flex;gap:12px;flex-wrap:wrap;">' + (f.options || []).map(o =>
            '<label style="font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer;">' +
            '<input type="checkbox" data-ck="' + esc(o.value) + '"' +
            ((f.value || []).indexOf(o.value) >= 0 ? ' checked' : '') + '> ' + esc(o.label) + '</label>').join('') +
          '</div></div>';
      }
      return '<div style="margin-bottom:12px;"><div class="hint" style="margin-bottom:4px;">' + esc(f.label) + '</div>' +
        '<input class="field" type="' + (f.type || 'text') + '" data-k="' + esc(f.key) + '" value="' +
        esc(f.value == null ? '' : f.value) + '"' +
        (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '></div>';
    }).join('');
    const o = uiOverlay('<div style="font-weight:500;margin-bottom:14px;">' + esc(title) + '</div>' + body + uiBtnRow('确定'));
    const done = v => { if (!__modalEl) return; uiCloseModal(); resolve(v); };
    o.card.querySelector('[data-uicancel]').addEventListener('click', () => done(null));
    o.card.querySelector('[data-uiok]').addEventListener('click', () => {
      const out = {};
      fields.forEach(f => {
        if (f.type === 'checks') {
          const picked = [];
          o.card.querySelectorAll('[data-ck]').forEach(c => { if (c.checked) picked.push(c.dataset.ck); });
          out[f.key] = picked;
        } else {
          const el = o.card.querySelector('[data-k="' + f.key + '"]');
          out[f.key] = el ? el.value : '';

      });
      done(out);
    });
    o.box.addEventListener('click', e => { if (e.target === o.box) done(null); });
    const first = o.card.querySelector('input,select');
    if (first) first.focus();
  });
}

/* ---------- 工具注册表 ---------- */
const registry = [];

/* 当前启用的工具（首页只显示这些；恢复某个工具把它加回列表即可，数据不会丢） */

function isEnabled(t) { return ENABLED_TOOLS.indexOf(t.id) >= 0; }

/* ============================================================
 * 工具 8：实习日志
 * ============================================================ */
registerTool({

        </div>
      </div>

          </div>
          ${panel}
          <textarea data-id="${l.id}" placeholder="今天做了什么、学到什么…">${esc(l.text)}</textarea>
          <div class="il-remarks">${remarks}</div>
          <div class="note-foot">
            <button class="il-radd" data-id="${l.id}">+ 备注</button>
            <span>${new Date(l.ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        </div>`;
      }).join('') || '<div class="empty">还没有日志，点「新日志」开始记录（日期可留空稍后选）</div>';
      renderHeat();
    }
    let heatMode = '6m';
    function calcStreak(counts) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      if (!counts[fmtDate(d)]) d.setDate(d.getDate() - 1);
      let n = 0;
      while (counts[fmtDate(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }
    function renderHeat() {
      const counts = {};
      let total = 0;
      logs.forEach(l => {
        if (!l.date) return;
        counts[l.date] = (counts[l.date] || 0) + 1;
        total++;
      });
      const gridEl = el.querySelector('.heat-grid');
      if (!gridEl) return;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      let start, end;
      if (heatMode === '6m' || heatMode === '12m') {
        const dow = (now.getDay() + 6) % 7;
        start = new Date(now);
        start.setDate(start.getDate() - dow - (heatMode === '6m' ? 25 : 52) * 7);
        end = new Date(now);
        end.setDate(end.getDate() + (6 - dow));
      } else {
        const y = +heatMode;
        const jan1 = new Date(y, 0, 1);
        start = new Date(jan1);
        start.setDate(start.getDate() - (jan1.getDay() + 6) % 7);
        end = new Date(y, 11, 31);
        end.setDate(end.getDate() + (6 - (end.getDay() + 6) % 7));
      }
      const monthsEl = el.querySelector('.heat-months');
      const statEl = el.querySelector('.il-heat-stat');
      let cells = '', months = '';
      const d = new Date(start);
      let col = 0, lastMonth = -1;
      while (d <= end) {
        if ((d.getDay() + 6) % 7 === 0) {
          if (d.getMonth() !== lastMonth) {
            months += '<span style="left:' + (col * 15) + 'px">' + (d.getMonth() + 1) + '月</span>';
            lastMonth = d.getMonth();
          }
          col++;
        }
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        const c = counts[key] || 0;
        const lv = c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : 3;
        const future = +d > +now;
        const cls = future ? 'lf' : 'l' + lv;
        const tip = future ? ' · 还没到' : (c ? ' · ' + c + ' 篇' : ' · 未写');
        cells += '<i class="' + cls + '"' + (+d === +now ? ' style="box-shadow:0 0 0 1.5px var(--accent)"' : '') + ' title="' + key + tip + '"></i>';
        d.setDate(d.getDate() + 1);
      }
      gridEl.innerHTML = cells;
      monthsEl.innerHTML = months;
      const streak = calcStreak(counts);
      let statText;
      if (/^\d{4}$/.test(heatMode)) {
        statText = heatMode + ' 年已写 ' + logs.filter(l => l.date && l.date.slice(0, 4) === heatMode).length + ' 篇';
      } else {
        const months = heatMode === '6m' ? 6 : 12;
        statText = logs.length > total
          ? '累计 ' + logs.length + ' 篇 · 近 ' + months + ' 个月 ' + total + ' 篇'
          : '近 ' + months + ' 个月已写 ' + total + ' 篇';
      }
      if (streak > 0) statText += ' · 连续 ' + streak + ' 天';
      if (statEl) statEl.textContent = statText;
      fillYearSelect();
    }
    function fillYearSelect() {
      const sel = el.querySelector('.il-heat-year');
      if (!sel) return;
      const years = [...new Set([new Date().getFullYear()]
        .concat(logs.filter(l => l.date).map(l => +l.date.slice(0, 4))))].sort((a, b) => b - a);
      sel.innerHTML = '<option value="6m">近 6 个月</option><option value="12m">近 12 个月</option>'
        + years.map(y => '<option value="' + y + '">' + y + ' 年</option>').join('');
      sel.value = String(heatMode);
      if (sel.value !== String(heatMode)) { heatMode = '6m'; sel.value = '6m'; }
    }
    el.querySelector('.il-heat-year').addEventListener('change', e => {
      heatMode = e.target.value;
      renderHeat();
    });
    const TAG_LIST = ['学习', '开发', '会议', '踩坑', '沟通', '其他'];
    const LOG_TEMPLATE = '【今日完成】\n\n\n【收获与思考】\n\n\n【明日计划】\n';
    let tagPanelId = null;
    function renderTagPanel(l) {
      const freq = {};
      logs.forEach(x => (x.tags || []).forEach(t => { freq[t] = (freq[t] || 0) + 1; }));
      const all = [...new Set(TAG_LIST.concat(Object.keys(freq)))]
        .sort((a, b) => (freq[b] || 0) - (freq[a] || 0));
      const items = all.map(t =>
        '<button class="il-tp-item' + ((l.tags || []).indexOf(t) >= 0 ? ' on' : '') + '" data-tag="' + esc(t) + '">' + esc(t) + (freq[t] ? '<em>' + freq[t] + '</em>' : '') + '</button>'
      ).join('');
      return `
        <div class="il-tp">
          <input class="il-tp-search" placeholder="搜索标签，或输入新名称回车创建">
          <div class="il-tp-list">${items}<button class="il-tp-item il-tp-create" data-tag="" hidden></button></div>
          <div class="il-tp-foot"><span class="hint">点标签选择 / 取消 · 输入新名称回车创建 · Esc 关闭</span><button class="btn btn-sm il-tp-done">完成</button></div>
        </div>`;
    }
    el.querySelector('.il-add').addEventListener('click', () => {
      const nid = 'il' + Date.now() + Math.floor(Math.random() * 1e4);
      logs.push({ id: nid, date: '', text: LOG_TEMPLATE, ts: Date.now() });
      saveNow();
      renderList();
      const ta = list.querySelector('textarea[data-id="' + nid + '"]');
      if (ta) ta.focus();
    });
    el.querySelector('.il-copy').addEventListener('click', async () => {
      if (!logs.length) { showToast('还没有日志'); return; }
      const text = sorted().map(l => {
        const rs = (l.remarks || []).filter(r => r.text.trim());
        return '【' + (l.date || '未填日期') + '】\n' + l.text.trim()
          + (rs.length ? '\n' + rs.map(r => '- ' + r.text.trim()).join('\n') : '');
      }).join('\n\n');
      showToast(await copyText(text) ? '已复制 ' + logs.length + ' 篇日志' : '复制失败');
    });
    list.addEventListener('keydown', e => {
      const s = e.target.closest('.il-tp-search');
      if (s) {
        if (e.key === 'Escape') { tagPanelId = null; renderList(); return; }
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = s.value.trim();
          if (!q) return;
          const n = logs.find(x => x.id === tagPanelId);
          if (!n) return;
          if (!n.tags) n.tags = [];
          if (n.tags.indexOf(q) < 0) n.tags.push(q);
          saveNow();
          renderList();
          const s2 = list.querySelector('.il-tp-search');
          if (s2) s2.focus();
        }
        return;
      }
    });
    list.addEventListener('input', e => {
      const s = e.target.closest('.il-tp-search');
      if (s) {
        const q = s.value.trim().toLowerCase();
        const panelEl = s.closest('.il-tp');
        let visible = 0;
        panelEl.querySelectorAll('.il-tp-item:not(.il-tp-create)').forEach(b => {
          const hit = !q || b.dataset.tag.toLowerCase().indexOf(q) >= 0;
          b.hidden = !hit;
          if (hit) visible++;
        });
        const create = panelEl.querySelector('.il-tp-create');
        if (q && visible === 0) {
          create.hidden = false;
          create.dataset.tag = s.value.trim();
          create.textContent = '创建「' + s.value.trim() + '」';
        } else {
          create.hidden = true;
        }
        return;
      }
      const rInput = e.target.closest('.il-remark input');
      if (rInput) {
        const n = logs.find(x => x.id === rInput.dataset.id);
        const rm = n && (n.remarks || []).find(x => x.id === rInput.dataset.rid);
        if (rm) {
          rm.text = rInput.value;
          n.ts = Date.now();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveNow, 500);
        }
        return;
      }
      const ta = e.target.closest('textarea');
      if (!ta) return;
      const n = logs.find(x => x.id === ta.dataset.id);
      if (!n) return;
      n.text = ta.value;
      n.ts = Date.now();
      const foot = ta.closest('.note-card').querySelector('.note-foot span');
      if (foot) foot.textContent = '已自动保存';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 500);
    });
    list.addEventListener('change', e => {
      const d = e.target.closest('.il-date');
      if (!d) return;
      const n = logs.find(x => x.id === d.dataset.id);
      if (!n) return;
      n.date = d.value;
      n.ts = Date.now();
      saveNow();
      renderList();
      if (d.value && logs.filter(x => x.date === d.value).length > 1) showToast(d.value + ' 已有其他日志');
    });
    list.addEventListener('click', e => {
      const addBtn = e.target.closest('.il-tag-add');
      if (addBtn) {
        tagPanelId = tagPanelId === addBtn.dataset.id ? null : addBtn.dataset.id;
        renderList();
        if (tagPanelId) {
          const s = list.querySelector('.il-tp-search');
          if (s) s.focus();
        }
        return;
      }
      const tpItem = e.target.closest('.il-tp-item');
      if (tpItem && tpItem.dataset.tag) {
        const n = logs.find(x => x.id === tagPanelId);
        if (n) {
          if (!n.tags) n.tags = [];
          const i = n.tags.indexOf(tpItem.dataset.tag);
          if (i >= 0) n.tags.splice(i, 1); else n.tags.push(tpItem.dataset.tag);
          saveNow();
        }
        renderList();
        return;
      }
      const tpDone = e.target.closest('.il-tp-done');
      if (tpDone) {
        tagPanelId = null;
        renderList();
        return;
      }
      const tag = e.target.closest('.il-tag');
      if (tag) {
        const n = logs.find(x => x.id === tag.dataset.id);
        if (n) {
          if (!n.tags) n.tags = [];
          const i = n.tags.indexOf(tag.dataset.tag);
          if (i >= 0) n.tags.splice(i, 1); else n.tags.push(tag.dataset.tag);
          saveNow();
          renderList();
        }
        return;
      }
      const dot = e.target.closest('.il-mood-dot');
      if (dot) {
        const n = logs.find(x => x.id === dot.dataset.id);
        if (n) {
          const v = +dot.dataset.v;
          n.mood = n.mood === v ? 0 : v;
          n.ts = Date.now();
          saveNow();
          renderList();
        }
        return;
      }
      const radd = e.target.closest('.il-radd');
      if (radd) {
        const n = logs.find(x => x.id === radd.dataset.id);
        if (!n) return;
        if (!n.remarks) n.remarks = [];
        const rid = 'r' + Date.now() + Math.floor(Math.random() * 1e4);
        n.remarks.push({ id: rid, text: '' });
        n.ts = Date.now();
        saveNow();
        renderList();
        const ri = list.querySelector('.il-remark input[data-rid="' + rid + '"]');
        if (ri) ri.focus();
        return;
      }
      const rdel = e.target.closest('.il-rdel');
      if (rdel) {
        const n = logs.find(x => x.id === rdel.dataset.id);
        if (n && n.remarks) {
          n.remarks = n.remarks.filter(x => x.id !== rdel.dataset.rid);
          n.ts = Date.now();
          saveNow();
          renderList();
        }
        return;
      }
      const btn = e.target.closest('.il-del');
      if (!btn) return;
      logs = logs.filter(x => x.id !== btn.dataset.id);
      saveNow();
      renderList();
    });
    function fmtDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function genReport(from, to, byTag) {
      const items = sorted().filter(l => l.date && l.date >= from && l.date <= to);
      if (!items.length) return '';
      const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const fmtItem = l => {
        const d = new Date(l.date + 'T00:00:00');
        const rs = (l.remarks || []).filter(r => r.text.trim());
        const mood = l.mood ? '（效率 ' + l.mood + '/5）' : '';
        return l.date + ' ' + wd[d.getDay()] + mood + '\n' + l.text.trim()
          + (rs.length ? '\n' + rs.map(r => '- ' + r.text.trim()).join('\n') : '');
      };
      if (!byTag) {
        return '【实习周报】' + from + ' 至 ' + to + '\n\n' + items.map(fmtItem).join('\n\n');
      }
      const groups = {};
      items.forEach(l => {
        const g = (l.tags && l.tags[0]) || '未分类';
        (groups[g] = groups[g] || []).push(l);
      });
      return '【实习周报】' + from + ' 至 ' + to + '（按标签汇总）\n\n'
        + Object.keys(groups).map(g => '◆ ' + g + '\n' + groups[g].map(fmtItem).join('\n\n')).join('\n\n');
    }
    const rpBox = el.querySelector('.il-report');
    const rpFrom = el.querySelector('.il-rp-from');
    const rpTo = el.querySelector('.il-rp-to');
    const rpOut = el.querySelector('.il-rp-out');
    el.querySelector('.il-report-btn').addEventListener('click', () => {
      if (rpBox.hidden) {
        const now2 = new Date();
        const dw = (now2.getDay() + 6) % 7;
        const mon = new Date(now2);
        mon.setDate(mon.getDate() - dw);
        rpFrom.value = fmtDate(mon);
        rpTo.value = fmtDate(now2);
        rpOut.value = '';
      }
      rpBox.hidden = !rpBox.hidden;
    });
    el.querySelector('.il-rp-gen').addEventListener('click', () => {
      if (!rpFrom.value || !rpTo.value) { showToast('请选择起止日期'); return; }
      const text = genReport(rpFrom.value, rpTo.value, el.querySelector('.il-rp-bytag').checked);
      rpOut.value = text || '该日期范围内没有已填写日期的日志';
    });
    el.querySelector('.il-rp-copy').addEventListener('click', async () => {
      if (!rpOut.value) { showToast('先点「生成」'); return; }
      showToast(await copyText(rpOut.value) ? '周报已复制' : '复制失败');
    });
    el.querySelector('.il-rp-close').addEventListener('click', () => { rpBox.hidden = true; });
    el.querySelector('.il-export').addEventListener('click', async () => {
      if (!logs.length) { showToast('还没有日志可导出'); return; }
      const data = { app: 'toolbox', type: 'internlog', exportedAt: new Date().toISOString(), count: logs.length, items: logs };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const name = '实习日志备份-' + fmtDate(new Date()) + '.json';
      if (await saveBlob(blob, name)) showToast('已导出 ' + logs.length + ' 篇日志');
    });
    const fileInput = el.querySelector('.il-file');
    el.querySelector('.il-import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const items = Array.isArray(data) ? data
            : (data && data.type === 'internlog' && Array.isArray(data.items)) ? data.items : null;
          if (!items) { showToast('文件格式不正确'); return; }
          const ids = new Set(logs.map(l => l.id));
          let added = 0;
          items.forEach(it => {
            if (it && it.id && !ids.has(it.id)) { logs.push(it); ids.add(it.id); added++; }
          });
          saveNow();
          renderList();
          showToast(added ? '已导入 ' + added + ' 条日志' : '备份内容已存在，无新增');
        } catch (err) { showToast('导入失败：文件无法解析'); }
      };
      reader.readAsText(f);
    });
    renderList();
    return () => clearTimeout(saveTimer);
  }
});
